name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs every 2 days at 06:00 UTC (11:30 AM IST)
    # Prevents Supabase Free Tier from pausing after 7 days of zero activity
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Sending keep-alive ping to Supabase..."
          SUPABASE_URL="https://hvjociwmylpkmjybcfmy.supabase.co"
          ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2am9jaXdteWxwa21qeWJjZm15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODYxOTIsImV4cCI6MjEwNjI2MjE5Mn0.NAUndpZNMViq1_Drgvd28gBh84UWjlE1RQ778NENe3s' }}"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/event_settings?select=id&limit=1")
          
          echo "Supabase HTTP response: ${HTTP_STATUS}"
          
          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            echo "✅ Supabase project is active and healthy! Inactivity reset successfully."
          else
            echo "⚠️ Warning: Received HTTP status ${HTTP_STATUS}."
          fi
